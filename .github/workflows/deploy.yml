```yaml
name: Deploy E-commerce Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ecommerce-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate Backend
        run: node --check src/server.js

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: SERVER_ENV,REPO_URL
          script: |
            set -eu

            APP_DIR="/var/www/shop"
            APP_NAME="ecommerce-backend"
            BRANCH="main"
            APP_PORT="3014"

            echo "Starting e-commerce backend deployment..."

            mkdir -p "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              if [ -n "$(ls -A "$APP_DIR")" ]; then
                echo "ERROR: Directory is not empty and is not a Git repository."
                exit 1
              fi

              echo "Cloning repository..."
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            else
              cd "$APP_DIR"

              echo "Updating repository..."
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            cd "$APP_DIR"

            if [ ! -f package.json ] || [ ! -f package-lock.json ]; then
              echo "ERROR: package.json or package-lock.json is missing."
              exit 1
            fi

            if [ ! -f src/server.js ]; then
              echo "ERROR: src/server.js not found."
              exit 1
            fi

            echo "Checking whether port $APP_PORT is available..."

            if command -v ss >/dev/null 2>&1; then
              if ss -lnt | awk -v port=":$APP_PORT" \
                '$4 ~ (port "$") { found=1 } END { exit !found }'; then
                echo "WARNING: Port $APP_PORT already has a listener."
                echo "Verify that it belongs to $APP_NAME before proceeding."
                exit 1
              fi
            fi

            echo "Writing production environment file..."
            umask 077
            printf '%s\n' "$SERVER_ENV" > .env
            chmod 600 .env

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "Validating backend..."
            node --check src/server.js

            echo "Starting or restarting application on port $APP_PORT..."

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 delete "$APP_NAME"
            fi

            PORT="$APP_PORT" pm2 start src/server.js \
              --name "$APP_NAME" \
              --update-env

            pm2 save

            echo "Checking application status..."
            sleep 3
            pm2 status "$APP_NAME"

            if ! pm2 describe "$APP_NAME" | grep -q "online"; then
              echo "ERROR: Application is not online."
              pm2 logs "$APP_NAME" --lines 50 --nostream || true
              exit 1
            fi

            echo "Checking local HTTP response..."
            if ! curl --fail --silent --show-error \
              --max-time 10 http://127.0.0.1:$APP_PORT/ \
              -o /dev/null; then
              echo "WARNING: HTTP check failed on /."
              echo "The application may use a different route or need more startup time."
              pm2 logs "$APP_NAME" --lines 30 --nostream || true
            fi

            echo "Deployment completed."
            sudo ss -lntp | grep ":$APP_PORT" || true
            pm2 status "$APP_NAME"
```
