
name: Deploy E-commerce Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ecommerce-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: SERVER_ENV
          script: |
            set -eu

            APP_DIR="/var/www/shop"
            APP_NAME="ecommerce-backend"
            BRANCH="main"

            echo "Starting deployment..."

            cd "$APP_DIR"

            echo "Fetching latest code..."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "Writing production environment file..."
            umask 077
            printf '%s\n' "$SERVER_ENV" > .env
            chmod 600 .env

            echo "Installing production dependencies..."
            npm ci --omit=dev
            

            echo "Restarting application..."
            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 restart "$APP_NAME" --update-env
            else
              pm2 start src/server.js --name "$APP_NAME"
            fi

            pm2 save

            echo "Deployment completed successfully."
            pm2 status "$APP_NAME"
