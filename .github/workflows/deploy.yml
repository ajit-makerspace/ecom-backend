name: Deploy E-commerce Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ecommerce-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate Backend
        run: |
          test -f package.json
          test -f package-lock.json
          test -f src/server.js
          node --check src/server.js

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: SERVER_ENV,REPO_URL
          script: |
            set -eu

            APP_DIR="/var/www/shop/ecommerce-backend"
            APP_NAME="ecommerce-backend"
            BRANCH="main"
            APP_PORT="3014"

            echo "Starting e-commerce backend deployment..."

            mkdir -p /var/www/shop

            if [ ! -d "$APP_DIR/.git" ]; then
              if [ -d "$APP_DIR" ] && [ -n "$(ls -A "$APP_DIR" 2>/dev/null)" ]; then
                echo "ERROR: $APP_DIR exists but is not a Git repository."
                echo "Refusing to delete or overwrite existing files."
                exit 1
              fi

              echo "Cloning repository..."
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            else
              cd "$APP_DIR"
              echo "Fetching latest code..."
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            cd "$APP_DIR"

            if [ ! -f package.json ] || [ ! -f package-lock.json ]; then
              echo "ERROR: package.json or package-lock.json is missing."
              exit 1
            fi

            if [ ! -f src/server.js ]; then
              echo "ERROR: src/server.js is missing."
              exit 1
            fi

            echo "Validating backend..."
            node --check src/server.js

            echo "Writing production environment..."
            umask 077
            printf '%s\n' "$SERVER_ENV" > .env
            chmod 600 .env

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "Checking PM2 application..."

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              echo "Existing PM2 application found."

              echo "Checking whether port $APP_PORT belongs to this application..."

              APP_PID="$(pm2 pid "$APP_NAME" | head -n 1 | tr -d '[:space:]')"

              LISTENER_PIDS=""

              if command -v ss >/dev/null 2>&1; then
                LISTENER_PIDS="$(
                  ss -lntp "sport = :$APP_PORT" 2>/dev/null \
                    | grep -oE 'pid=[0-9]+' \
                    | cut -d= -f2 \
                    | sort -u \
                    || true
                )"
              fi

              if [ -n "$LISTENER_PIDS" ]; then
                MATCH=0

                for PID in $LISTENER_PIDS; do
                  if [ "$PID" = "$APP_PID" ]; then
                    MATCH=1
                  fi
                done

                if [ "$MATCH" -ne 1 ]; then
                  echo "ERROR: Port $APP_PORT has a listener that does not match the PM2 application PID."
                  echo "PM2 PID: $APP_PID"
                  echo "Listener PID(s): $LISTENER_PIDS"
                  echo "No process was killed. Resolve the conflict before deploying."
                  exit 1
                fi
              fi

              echo "Restarting existing PM2 application..."
              PORT="$APP_PORT" pm2 restart "$APP_NAME" --update-env

            else
              echo "No existing PM2 application found."

              if command -v ss >/dev/null 2>&1 &&
                 ss -lnt "sport = :$APP_PORT" | grep -q LISTEN; then
                echo "ERROR: Port $APP_PORT is already occupied."
                echo "Refusing to start another application on this port."
                ss -lntp "sport = :$APP_PORT" || true
                exit 1
              fi

              echo "Starting new PM2 application..."
              PORT="$APP_PORT" pm2 start src/server.js \
                --name "$APP_NAME" \
                --update-env
            fi

            echo "Saving PM2 process list..."
            pm2 save

            echo "Waiting for application startup..."
            sleep 5

            echo "Checking PM2 status..."
            pm2 status "$APP_NAME"

            STATUS="$(pm2 jlist | node -e '
              let data = "";
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                const apps = JSON.parse(data);
                const app = apps.find(p => p.name === "ecommerce-backend");
                console.log(app ? app.pm2_env.status : "missing");
              });
            ')"

            if [ "$STATUS" != "online" ]; then
              echo "ERROR: Application status is $STATUS."
              pm2 logs "$APP_NAME" --lines 50 --nostream || true
              exit 1
            fi

            echo "Checking port $APP_PORT..."
            if ! ss -lnt "sport = :$APP_PORT" | grep -q LISTEN; then
              echo "ERROR: No listener found on port $APP_PORT."
              pm2 logs "$APP_NAME" --lines 50 --nostream || true
              exit 1
            fi

            echo "Checking local HTTP response..."

            if ! curl --fail --silent --show-error \
              --max-time 10 \
              "http://127.0.0.1:$APP_PORT/" \
              -o /dev/null; then
              echo "WARNING: HTTP check on / failed."
              echo "Check whether the backend uses a different route."
              pm2 logs "$APP_NAME" --lines 30 --nostream || true
            fi

            echo "Deployment completed successfully."
            pm2 status "$APP_NAME"
            ss -lntp "sport = :$APP_PORT" || true
