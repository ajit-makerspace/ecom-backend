
name: Deploy E-commerce Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ecommerce-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate Backend
        run: node --check src/server.js

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: SERVER_ENV,REPO_URL
          script: |
            set -eu

            APP_DIR="/var/www/shop"
            APP_NAME="ecommerce-backend"
            BRANCH="main"

            echo "Starting deployment..."

            mkdir -p "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              if [ -n "$(ls -A "$APP_DIR")" ]; then
                echo "ERROR: Directory is not empty and is not a Git repository."
                exit 1
              fi

              echo "Cloning repository..."
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            else
              cd "$APP_DIR"

              echo "Updating repository..."
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            cd "$APP_DIR"

            if [ ! -f package.json ] || [ ! -f package-lock.json ]; then
              echo "ERROR: package.json or package-lock.json is missing."
              exit 1
            fi

            if [ ! -f src/server.js ]; then
              echo "ERROR: src/server.js not found."
              exit 1
            fi

            echo "Writing production environment file..."
            umask 077
            printf '%s\n' "$SERVER_ENV" > .env
            chmod 600 .env

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "Validating backend..."
            node --check src/server.js

            echo "Restarting application..."
            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 restart "$APP_NAME" --update-env
            else
              pm2 start src/server.js --name "$APP_NAME"
            fi

            pm2 save

            echo "Deployment completed successfully."
            pm2 status "$APP_NAME"
